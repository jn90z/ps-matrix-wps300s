name: Windows build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore MatrixWps300s.csproj
      - run: dotnet build MatrixWps300s.csproj -c Release --no-restore
